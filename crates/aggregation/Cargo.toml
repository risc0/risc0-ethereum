[package]
name = "risc0-aggregation"
description = "Proof aggregation for RISC Zero"
resolver = "2"
version = "0.9.0"
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
bytemuck = { workspace = true }
# TODO(#353) Determine if it is possible to publish risc0-aggregation with set builder image ID and ELF
#guest-set-builder = { version = "0.1.0", path = "./guest", optional = true }
hex = { workspace = true }
# Deprecated: set aggregation stays at the versions set-builder v0.9.0 was built with, so that its
# guest (and image ID) does not change; risc0 3.1 is not supported.
risc0-binfmt = { version = "3.0.2", default-features = false }
risc0-zkp = { version = "3.0.2", default-features = false }
risc0-zkvm = { version = "3.0.3", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
default = ["verify"]
verify = []
